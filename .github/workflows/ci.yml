name: CI

on:
  push:
  pull_request:

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: python -m pip install -r ml/requirements.txt

      - name: Python tests
        run: PYTHONPATH=ml python -m pytest ml/tests -q

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: .NET tests
        run: dotnet test BatteryHealth.Linux.slnf --configuration Release

      - name: CLI forecast and simulate
        run: |
          dotnet run --project src/BatteryHealth.Cli --configuration Release -- forecast tests/fixtures/tiny_battery.json --cycle 1
          dotnet run --project src/BatteryHealth.Cli --configuration Release -- simulate tests/fixtures/B0005.sample.json --temp 45 --crate 2 --cycle 40
