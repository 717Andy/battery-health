[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "batteryhealth"
version = "0.1.0"
description = "Feature engineering, training, ONNX export, and FastAPI service for BatteryHealth"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.1",
  "scipy>=1.11",
  "scikit-learn>=1.4",
  "xgboost>=2.0",
  "onnx>=1.16",
  "onnxruntime>=1.18",
  "skl2onnx>=1.17",
  "onnxmltools>=1.13",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "python-multipart>=0.0.9",
  "openpyxl>=3.1",
  "joblib>=1.3",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
torch = ["torch>=2.2"]

[project.scripts]
batteryhealth-download = "batteryhealth.download:main"
batteryhealth-train = "batteryhealth.train:main"
batteryhealth-serve = "batteryhealth.service.app:main"

[tool.setuptools.packages.find]
include = ["batteryhealth*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
