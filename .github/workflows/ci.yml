name: CI

on:
  push:
  pull_request:

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: python -m pip install -r ml/requirements.txt

      - name: Python tests
        run: PYTHONPATH=ml python -m pytest ml/tests -q

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: .NET tests
        run: dotnet test BatteryHealth.Linux.slnf --configuration Release

      - name: CLI forecast and simulate
        run: |
          dotnet run --project src/BatteryHealth.Cli --configuration Release -- forecast tests/fixtures/tiny_battery.json --cycle 1
          dotnet run --project src/BatteryHealth.Cli --configuration Release -- simulate tests/fixtures/B0005.sample.json --temp 45 --crate 2 --cycle 40
          dotnet run --project src/BatteryHealth.Cli --configuration Release -- export tests/fixtures/tiny_battery.json --out "$RUNNER_TEMP/battery-decision.csv" --temp 45 --crate 2

  # Optional WinUI 3 shell. Does not run the GUI. Restoring the same .csproj on
  # ubuntu-latest fails with NETSDK1100 (Windows targeting pack).
  winui:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - uses: microsoft/setup-msbuild@v2

      # Official unpackaged recipe: MSBuild Restore then Publish (not `dotnet build`).
      # WASDK 1.6's net472 XamlCompiler.exe exited 1 with no XAML diagnostic
      # (`MSB3073`). 1.8 surfaces WMC* errors. Do not pass RuntimeIdentifier
      # together with Platform=x64 — that produced `win-x64\\input.json`.
      - name: Restore WinUI app
        run: msbuild src/BatteryHealth.App/BatteryHealth.App.csproj -t:Restore -p:Configuration=Release -p:Platform=x64

      - name: Publish unpackaged x64 WinUI 3 app
        run: >
          msbuild src/BatteryHealth.App/BatteryHealth.App.csproj
          -t:Publish
          -p:Configuration=Release
          -p:Platform=x64
          -p:WindowsPackageType=None
          -p:WindowsAppSDKSelfContained=true
          -p:GenerateAppxPackageOnBuild=false
          -p:AppxPackageSigningEnabled=false

      - name: Dump XAML compiler logs
        if: failure()
        shell: pwsh
        run: |
          Get-ChildItem -Path src/BatteryHealth.App -Recurse -File -ErrorAction SilentlyContinue |
            Where-Object { $_.Name -match '^(output\.json|input\.json|XamlSaveStateFile\.xml)$' -or $_.Extension -in '.log','.err' } |
            ForEach-Object {
              Write-Host "===== $($_.FullName) ====="
              Get-Content -LiteralPath $_.FullName -Raw -ErrorAction SilentlyContinue
            }
